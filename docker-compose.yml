services:
  postgres:
    image: postgres:16
    container_name: medguard_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: medguard
      POSTGRES_PASSWORD: medguard_dev
      POSTGRES_DB: medguard

    ports:
      - "5432:5432"

    volumes:
      - medguard_postgres_data:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2.44.0
    container_name: medguard_hasura
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://medguard:medguard_dev@postgres:5432/medguard

      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"

      HASURA_GRAPHQL_ADMIN_SECRET: medguard_dev_secret

volumes:
  medguard_postgres_data: